<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Coin</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #171735, #090914);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game {
    width: 100%;
    max-width: 430px;
    padding: 15px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.stats {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
}

.stat {
    flex: 1;
    background: rgba(255,255,255,.12);
    padding: 12px 5px;
    border-radius: 15px;
    font-size: 16px;
}

#game {
    width: 100%;
    height: 520px;
    display: block;
    background: #70cfff;
    border: 3px solid rgba(255,255,255,.3);
    border-radius: 20px;
    touch-action: none;
}

button {
    width: 100%;
    margin-top: 14px;
    padding: 17px;
    border: 0;
    border-radius: 16px;
    background: #ffd21f;
    color: #171717;
    font-size: 19px;
    font-weight: bold;
}

button:active {
    transform: scale(.97);
}

#message {
    margin-top: 12px;
    font-size: 20px;
    min-height: 25px;
}
</style>
</head>

<body>

<div class="game">

<h1>🪙 Flappy Coin</h1>

<div class="stats">
    <div class="stat">💰 <span id="coins">0</span></div>
    <div class="stat">🏆 <span id="score">0</span></div>
</div>

<canvas id="game"></canvas>

<button id="start">🎮 НАЧАТЬ ИГРУ</button>

<div id="message">Нажми кнопку, чтобы начать</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");
const scoreElement = document.getElementById("score");
const coinsElement = document.getElementById("coins");
const message = document.getElementById("message");

let W = 0;
let H = 0;

let running = false;
let score = 0;
let coins = 0;

let bestScore = Number(localStorage.getItem("flappyBest") || 0);
let totalCoins = Number(localStorage.getItem("flappyCoins") || 0);

coinsElement.textContent = totalCoins;
scoreElement.textContent = bestScore;
let animation = null;
let lastTime = 0;
let spawnTimer = 0;

const player = {
    x: 80,
    y: 200,
    r: 18,
    velocity: 0
};

const gravity = 0.0015;
const jumpPower = -0.55;
const pipeSpeed = 0.25;

let pipes = [];
let bonusCoins = [];

function resize() {
    const rect = canvas.getBoundingClientRect();

    W = Math.floor(rect.width);
    H = Math.floor(rect.height);

    canvas.width = W;
    canvas.height = H;

    if (!running) {
        player.y = H / 2;
    }

    draw();
}

window.addEventListener("resize", resize);

function reset() {
    score = 0;
    coins = 0;

    scoreElement.textContent = "0";
    coinsElement.textContent = "0";

    pipes = [];
    bonusCoins = [];

    player.x = Math.min(80, W * 0.25);
    player.y = H / 2;
    player.velocity = 0;

    spawnTimer = 0;
}

function flap() {
    if (!running) return;

    player.velocity = jumpPower;
}

function createPipe() {
    const gap = Math.min(170, H * 0.30);
    const margin = 55;

    const maxTop = H - gap - margin;

    const top =
        margin +
        Math.random() * Math.max(1, maxTop - margin);

    pipes.push({
        x: W + 20,
        width: 65,
        top: top,
        gap: gap,
        passed: false
    });

    bonusCoins.push({
        x: W + 52,
        y: top + gap / 2,
        r: 12,
        collected: false
    });
}

function drawBackground() {
    ctx.fillStyle = "#70cfff";
    ctx.fillRect(0, 0, W, H);

    // облака
    ctx.fillStyle = "rgba(255,255,255,.75)";

    drawCloud(70, 75, 1);
    drawCloud(W - 90, 160, .8);

    // земля
    ctx.fillStyle = "#7bc043";
    ctx.fillRect(0, H - 25, W, 25);

    ctx.fillStyle = "#5d9c31";
    ctx.fillRect(0, H - 25, W, 5);
}

function drawCloud(x, y, scale) {
    ctx.beginPath();

    ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
    ctx.arc(x + 25 * scale, y - 10 * scale, 28 * scale, 0, Math.PI * 2);
    ctx.arc(x + 55 * scale, y, 20 * scale, 0, Math.PI * 2);

    ctx.fill();
}

function drawPlayer() {
    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.fillStyle = "#ffd21f";

    ctx.beginPath();
    ctx.arc(0, 0, player.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#b88600";
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = "#8a6500";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 1);

    ctx.restore();
}

function drawPipes() {
    for (const pipe of pipes) {

        ctx.fillStyle = "#35a900";

        ctx.fillRect(
            pipe.x,
            0,
            pipe.width,
            pipe.top
        );

        ctx.fillRect(
            pipe.x,
            pipe.top + pipe.gap,
            pipe.width,
            H
        );

        ctx.fillStyle = "#258000";

        ctx.fillRect(
            pipe.x - 5,
            pipe.top - 15,
            pipe.width + 10,
            15
        );

        ctx.fillRect(
            pipe.x - 5,
            pipe.top + pipe.gap,
            pipe.width + 10,
            15
        );
    }
}

function drawCoins() {
    for (const coin of bonusCoins) {

        if (coin.collected) continue;

        ctx.fillStyle = "#ffd21f";

        ctx.beginPath();
        ctx.arc(
            coin.x,
            coin.y,
            coin.r,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.strokeStyle = "#b88600";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#8a6500";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("$", coin.x, coin.y);
    }
}

function hitPipe(pipe) {
    const left = player.x - player.r;
    const right = player.x + player.r;
    const top = player.y - player.r;
    const bottom = player.y + player.r;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + pipe.width;

    if (right < pipeLeft || left > pipeRight) {
        return false;
    }

    if (top < pipe.top) {
        return true;
    }

    if (bottom > pipe.top + pipe.gap) {
        return true;
    }

    return false;
}

function collectCoins() {
    for (const coin of bonusCoins) {

        if (coin.collected) continue;

        const dx = player.x - coin.x;
        const dy = player.y - coin.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        if (distance < player.r + coin.r) {

            coin.collected = true;

            coins++;

totalCoins += 1;
localStorage.setItem("flappyCoins", totalCoins);

coinsElement.textContent = totalCoins; 
        }
    }
}

function update(delta) {

    player.velocity += gravity * delta;
    player.y += player.velocity * delta;

    if (
        player.y - player.r < 0 ||
        player.y + player.r > H - 25
    ) {
        gameOver();
        return;
    }

    for (const pipe of pipes) {

        pipe.x -= pipeSpeed * delta;

        if (
            !pipe.passed &&
            pipe.x + pipe.width < player.x
        ) {
            pipe.passed = true;

            score++;

            scoreElement.textContent = score;
        }

        if (hitPipe(pipe)) {
            gameOver();
            return;
        }
    }

    for (const coin of bonusCoins) {
        coin.x -= pipeSpeed * delta;
    }

    collectCoins();

    pipes = pipes.filter(
        pipe => pipe.x + pipe.width > -20
    );

    bonusCoins = bonusCoins.filter(
        coin => coin.x > -30
    );

    spawnTimer += delta;

    if (spawnTimer > 1500) {
        createPipe();
        spawnTimer = 0;
    }
}

function draw() {
    drawBackground();
    drawPipes();
    drawCoins();
    drawPlayer();
}

function loop(time) {

    if (!running) return;

    if (!lastTime) {
        lastTime = time;
    }

    let delta = time - lastTime;

    if (delta > 50) {
        delta = 50;
    }

    lastTime = time;

    update(delta);
    draw();

    if (running) {
        animation = requestAnimationFrame(loop);
    }
}

function startGame() {

    if (animation) {
        cancelAnimationFrame(animation);
    }

    reset();

    running = true;
    lastTime = 0;

    startButton.textContent = "🪙 ИГРА ИДЁТ";
    message.textContent = "👆 Нажимай на экран, чтобы лететь";

    createPipe();

    animation =
        requestAnimationFrame(loop);
}

function gameOver() {
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("flappyBest", bestScore);
    }
scoreElement.textContent = bestScore;
    running = false;

    if (animation) {
        cancelAnimationFrame(animation);
        animation = null;
    }

    startButton.textContent = "🔄 ИГРАТЬ СНОВА";

    message.textContent =
        "Игра окончена! Очки: " + score;
}

startButton.addEventListener("click", startGame);

canvas.addEventListener("pointerdown", function(event) {
    event.preventDefault();
    flap();
});

resize();
</script>

</body>
</html>
